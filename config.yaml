paths:
  raw_labels_path: "data/SEP-28k_labels.csv"
  raw_clips_dir: "clips"
  base_dir: "."
  cache_dir: "cache"
  degraded_audio_dir: "cache/degraded_audio"
  results_dir: "results"
  figures_dir: "figure"

model:
  encoder: "microsoft/wavlm-base-plus"
  sample_rate: 16000
  batch_size: 16

random_seed: 42
n_folds: 5
n_bootstrap: 1000
hard_thresh: 1
cache_version: "v3"

stutter_classes:
  - Block
  - Prolongation
  - SoundRep
  - WordRep
  - Interjection

degradation_conditions:
  - clean
  - opus_16k
  - opus_8k
  - opus_16k_dtx
  - vad_agg3
  - vad_zero
  - denoise
  - full_chain
